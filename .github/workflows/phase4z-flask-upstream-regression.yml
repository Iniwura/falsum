name: Phase 4Z - new Flask source-project upstream security regression, not model gold
on:
  push:
    paths:
      - 'src/falsum/phase4z_flask_upstream_runtime.py'
      - 'tests/test_phase4z_flask_upstream_runtime.py'
      - 'data/phase4z-flask-new-source-lock.json'
      - 'docs/PHASE4Z_FLASK_NEW_SOURCE_CASE.md'
      - '.github/workflows/phase4z-flask-upstream-regression.yml'
  pull_request:
    paths:
      - 'src/falsum/phase4z_flask_upstream_runtime.py'
      - 'tests/test_phase4z_flask_upstream_runtime.py'
      - 'data/phase4z-flask-new-source-lock.json'
      - 'docs/PHASE4Z_FLASK_NEW_SOURCE_CASE.md'
      - '.github/workflows/phase4z-flask-upstream-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-upstream-flask-source:
    name: Original Flask parent/fix and exact upstream regression
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tampering and evidence-schema unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase4z_flask_upstream_runtime.py' -v
      - name: Install versions compatible with historical upstream test runner
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'pytest==7.4.4' 'Werkzeug==2.3.8' 'Jinja2==3.1.2' \
            'itsdangerous==2.1.2' 'click==8.1.3' 'blinker==1.6.2'
          python -m pip freeze
      - name: Select verified upstream original parent and fixed Git commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from falsum.phase4z_flask_upstream_runtime import load_lock
          lock=load_lock(Path('data/phase4z-flask-new-source-lock.json').read_bytes())
          with open(Path(__import__('os').environ['GITHUB_ENV']), 'a') as f:
              f.write('UPSTREAM_PARENT='+lock['direct_parent']+'\n')
              f.write('UPSTREAM_FIX='+lock['fixed_commit']+'\n')
          PY
        env:
          PYTHONPATH: src
      - name: Checkout exact original upstream source, no moving branch/tag
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/phase4z-flask"
          mkdir -p "$root"
          git init -q "$root/repository"
          git -C "$root/repository" remote add origin https://github.com/pallets/flask.git
          git -C "$root/repository" -c protocol.version=2 fetch --quiet --no-tags --depth=1 origin "$UPSTREAM_PARENT"
          git -C "$root/repository" -c protocol.version=2 fetch --quiet --no-tags --depth=1 origin "$UPSTREAM_FIX"
          git -C "$root/repository" worktree add --detach -q "$root/parent" "$UPSTREAM_PARENT"
          git -C "$root/repository" worktree add --detach -q "$root/fixed" "$UPSTREAM_FIX"
          test "$(git -C "$root/parent" rev-parse HEAD)" = "$UPSTREAM_PARENT"
          test "$(git -C "$root/fixed" rev-parse HEAD)" = "$UPSTREAM_FIX"
          mkdir -p "$root/logs"
          echo "FLASK_PROOF_ROOT=$root" >> "$GITHUB_ENV"
      - name: Execute original upstream test and fail/pass security counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          root="$FLASK_PROOF_ROOT"
          run_case() {
            local folder="$1" name="$2" selector="$3"
            set +e
            (cd "$folder" && PYTHONPATH="$folder/src" python -m pytest -q -v "$selector") > "$root/logs/$name.log" 2>&1
            status=$?
            set -e
            printf "%s\n" "$status" > "$root/logs/$name.exit"
          }
          python - <<'PY'
          import os
          from pathlib import Path
          from falsum.phase4z_flask_upstream_runtime import PIN,git_blob
          root=Path(os.environ['FLASK_PROOF_ROOT'])
          for revision in ('parent','fixed'):
              for kind in ('source','test'):
                  path=root/revision/PIN[kind+'_path']
                  actual=git_blob(path.read_bytes())
                  expected=PIN[revision+'_'+kind+'_blob']
                  assert actual==expected, f'pre-execution upstream {revision} {kind} bytes differ'
          PY
          run_case "$root/parent" parent-original "tests/test_basic.py::test_session_vary_cookie"
          test "$(cat "$root/logs/parent-original.exit")" = "0"
          cp "$root/fixed/tests/test_basic.py" "$root/parent/tests/test_basic.py"
          run_case "$root/parent" parent-regression "tests/test_basic.py::test_session_refresh_vary"
          run_case "$root/fixed" fixed-regression "tests/test_basic.py::test_session_refresh_vary"
          # All three logs are PUBLIC historical source tests with only fake fixtures.
          # Never convert a setup/import failure into a valid security regression.
          for name in parent-original parent-regression fixed-regression; do
            echo "===== $name ====="
            printf "exit=%s\\n" "$(cat "$root/logs/$name.exit")"
            tail -n 110 "$root/logs/$name.log"
          done
        env:
          PYTHONPATH: src
      - name: Verify exact source, direct parent, upstream test, and expected regression assertion
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.phase4z_flask_upstream_runtime \
            --lock data/phase4z-flask-new-source-lock.json \
            --parent "$FLASK_PROOF_ROOT/parent" --fixed "$FLASK_PROOF_ROOT/fixed" \
            --logs "$FLASK_PROOF_ROOT/logs" \
            --out phase4z-flask-actual-upstream-test-proof.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('phase4z-flask-actual-upstream-test-proof.json')
          r=json.loads(p.read_text())
          assert r['original_upstream_parent_test_passed'] is True
          assert r['parent_failed_fixed_upstream_security_test_expected_assertion'] is True
          assert r['fixed_passed_same_original_upstream_security_test'] is True
          assert r['independent_human_security_gold']==0
          assert r['new_model_generalization_proven'] is False
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Phase 4Z: real upstream Flask security regression\n\n')
              f.write('Original parent control PASS, original upstream fixed-regression FAIL on parent for expected Vary-header assertion, and same fixed upstream regression PASS on original fixed source. All exact Git commit and source/test blob pins authenticated.\n\n')
              f.write('**Researcher-selected new source project, NOT blind model generalization, independent AppSec gold, production cookie exploit, Anjoman admission or registered evaluator.**\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4z-flask-exact-new-upstream-security-source-proof
          path: phase4z-flask-actual-upstream-test-proof.json
          retention-days: 90
          if-no-files-found: warn
