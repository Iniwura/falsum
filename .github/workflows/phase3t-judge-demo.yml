name: Phase 3T - understandable guided evaluator demonstration
on:
  push:
    paths:
      - 'src/falsum/templates/firma_editorial_evidence_lab.html'
      - 'tests/test_phase3t_guided_demo.py'
      - 'tests/browser/phase3t_judge_flow.cjs'
      - '.github/workflows/phase3t-judge-demo.yml'
      - 'docs/PHASE3T.md'
  pull_request:
    paths:
      - 'src/falsum/templates/firma_editorial_evidence_lab.html'
      - 'tests/test_phase3t_guided_demo.py'
      - 'tests/browser/phase3t_judge_flow.cjs'
      - '.github/workflows/phase3t-judge-demo.yml'
      - 'docs/PHASE3T.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    name: Test honest guided evaluator demo on Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public example, real Python proof, non-network and confidentiality
        run: |
          set -euo pipefail
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase3t_guided_demo.py' -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase3s_editorial_evidence_lab.py' -v
  browser-judge-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Real Chromium guided quiz and responsive layout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser automation
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute real local Python fixtures; produce HTML + exact evidence
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.phase3q_mission_lab --out-dir public
          node --check tests/browser/phase3t_judge_flow.cjs
      - name: Run actual interactive full 3-case browser journey
        env:
          TEST_SITE_DIR: ${{ github.workspace }}/public
        run: |
          set -euo pipefail
          node tests/browser/phase3t_judge_flow.cjs
      - name: Preserve screenshots and source proof for developer inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PHASE3T-GUIDED-REVIEW-CHROMIUM-EVIDENCE
          path: |
            public/phase3t-*.png
            public/index.html
            public/ACTUAL-SYNTHETIC-RUNTIME-PROOF.json
          if-no-files-found: warn
          retention-days: 30
