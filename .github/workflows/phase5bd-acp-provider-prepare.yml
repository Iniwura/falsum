name: Phase 5BD - ACP provider deliverable preparation
on:
  pull_request:
    paths:
      - 'src/falsum/phase5bd_acp_provider_prepare.py'
      - 'src/falsum/phase5bb_acp_security_acceptance.py'
      - 'data/phase5bd-acp-provider-protocol.json'
      - 'tests/test_phase5bd_acp_provider_prepare.py'
      - '.github/workflows/phase5bd-acp-provider-prepare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Verify official submit contract and funded-job preparation controls
        run: python -m unittest discover -s tests -p 'test_phase5bd_acp_provider_prepare.py' -v
