name: Phase 5Z - application actually filters original Miner security advisory references
on:
  push:
    paths:
      - 'data/phase5z-frozen-app-consumption-protocol.json'
      - 'src/falsum/phase5z_reviewed_advisory_consumption.py'
      - 'src/falsum/phase5aa_offline_reviewed_bundle.py'
      - 'src/falsum/cli.py'
      - 'tests/test_phase5z_reviewed_advisory_consumption.py'
      - 'tests/test_phase5aa_offline_reviewed_bundle.py'
      - '.github/workflows/phase5z-original-reviewed-advisory-consumption.yml'
  pull_request:
    paths:
      - 'data/phase5z-frozen-app-consumption-protocol.json'
      - 'src/falsum/phase5z_reviewed_advisory_consumption.py'
      - 'src/falsum/phase5aa_offline_reviewed_bundle.py'
      - 'src/falsum/cli.py'
      - 'tests/test_phase5z_reviewed_advisory_consumption.py'
      - 'tests/test_phase5aa_offline_reviewed_bundle.py'
      - '.github/workflows/phase5z-original-reviewed-advisory-consumption.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-adversarial-and-schema-controls:
    name: Safe app consumption, wrong package/version, no forged original proofs / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Validate freeze, local DTO input and original source defense-in-depth
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase5z_reviewed_advisory_consumption.py' -v
          python -m unittest discover -s tests -p 'test_phase5aa_offline_reviewed_bundle.py' -v
          python -m unittest discover -s tests -p 'test_phase5x_three_real_miner_target_relevance.py' -v
          python -m unittest discover -s tests -p 'test_phase5y_original_reviewed_version_applicability.py' -v
          python -m falsum.cli --help | grep -F filter-security-references
          python -m falsum.cli --help | grep -F bundle-reviewed-advisories
  actual-original-public-provider-and-independent-git-review:
    name: Recheck all 3 original external Miner Git captures and 6 independently reviewed advisory files
    needs: local-adversarial-and-schema-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actually fetch nine original Git SHA1-verified public sources and issue sanitized application decisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-source-bound-app-reference-gate
          python -m falsum.cli filter-security-references \
            --out original-source-bound-app-reference-gate/ORIGINAL-THREE-REAL-PROVIDER-GIT-REVIEWED-DISPLAY-DECISIONS.json
      - name: Fail closed on any original-reference inapplicable version being displayed or original source identity drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          f=Path('original-source-bound-app-reference-gate/ORIGINAL-THREE-REAL-PROVIDER-GIT-REVIEWED-DISPLAY-DECISIONS.json')
          v=json.loads(f.read_text())
          assert v['schema_version']==1
          assert v['status']=='PHASE5Z_ORIGINAL_THREE_MINER_SAFE_REFERENCE_CONSUMPTION'
          assert v['original_external_git_authenticated_miner_captures']==3
          assert v['original_reviewed_advisory_git_verified_sources']==6
          assert v['original_real_unscoped_advisory_feed_denied']==1
          assert v['original_direct_provider_outputs_reference_filtered']==2
          assert v['original_direct_provider_references']==12
          assert v['original_reviewed_version_applicable_display_only_references']==10
          assert v['original_version_inapplicable_suppressed_references']==2
          assert v['original_distinct_advisories_with_version_false_positive']==1
          assert v['all_requests_same_canonical_intent'] is False
          assert v['independent_paid_settlement_verified'] is False
          assert v['independent_appsec_gold']==0
          assert v['external_adoption_proven'] is False
          assert v['network_evaluator_registered'] is False
          assert v['network_ranking_improvement_proven'] is False
          assert v['official_hackathon_submission'] is False
          assert v['entire_original_third_party_body_republished'] is False
          cases=v['public_original_source_decisions']
          assert len(cases)==3
          assert [x['reported_original_miner_id'] for x in cases]==['77003','190048','77010']
          assert cases[0]['display_only_security_reference_decision']['display_count']==0
          assert cases[0]['display_only_security_reference_decision']['action']=='DENY_UNVERIFIED_OR_UNSCOPED_ADVICE'
          for case in cases[1:]:
            out=case['display_only_security_reference_decision']
            assert out['action']=='DISPLAY_REVIEWED_VERSION_APPLICABLE_REFERENCES_ONLY'
            assert out['original_external_capture_git_verified'] is True
            assert out['display_count']==5
            assert out['suppressed_count']==1
            assert len(out['display_references'])==5
            assert len(out['suppressed_references'])==1
            assert all(x['verified_ghsa_id']!='GHSA-f23m-r3pf-42rh' for x in out['display_references'])
            assert out['suppressed_references'][0]['verified_ghsa_id']=='GHSA-f23m-r3pf-42rh'
            assert all(x['reference_meaning']=='MATCHES_REVIEWED_PACKAGE_VERSION_RANGE_NOT_SECURITY_CLEARANCE' for x in out['display_references'])
          assert '"result":' not in f.read_text()
          assert '"advisoryKeys":' not in f.read_text()
          print('Three original outside source responses cross-reviewed against six authentic advisories; 100 off-target advisory rows refused; ten version-applicable original reference instances display-only; two inapplicable filtered.')
          PY
      - name: Export the six actually authenticated reviewed source files into a portable bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m falsum.cli bundle-reviewed-advisories \
            --out original-source-bound-app-reference-gate/ORIGINAL-SIX-GIT-REVIEWED-ADVISORY-OFFLINE-BUNDLE.json
      - name: Compare genuine original Miner decisions with fully offline advisory loading and reject source-byte mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from copy import deepcopy
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          import json
          from falsum.phase5aa_offline_reviewed_bundle import load_bundle
          from falsum.phase5x_three_real_miner_target_relevance import _original_docs
          from falsum.phase5z_reviewed_advisory_consumption import consume, main, ALLOW, DENY

          bundle=Path('original-source-bound-app-reference-gate/ORIGINAL-SIX-GIT-REVIEWED-ADVISORY-OFFLINE-BUNDLE.json')
          online=json.loads(Path('original-source-bound-app-reference-gate/ORIGINAL-THREE-REAL-PROVIDER-GIT-REVIEWED-DISPLAY-DECISIONS.json').read_text())
          originals=_original_docs()  # independently reverify 3 real external pinned Git blobs
          assert len(originals)==3
          # From here: no online fetch can occur during application consumption.
          with patch('falsum.phase5y_original_reviewed_version_applicability.urlopen',
                     side_effect=AssertionError('unexpected network fetch')), \
               patch('falsum.phase4l_external_receipt_evidence.urlopen',
                     side_effect=AssertionError('unexpected network fetch')):
              rows=load_bundle(bundle)
              assert len(rows)==6
              with TemporaryDirectory() as directory:
                  folder=Path(directory)
                  for position,entry in enumerate(originals):
                      role=entry['spec']['role']
                      req=entry['document']['request']
                      body=entry['document']['body']
                      observed=consume(role,req,body,rows)
                      expected=online['public_original_source_decisions'][position]['display_only_security_reference_decision']
                      assert observed['action']==expected['action']
                      assert observed['display_references']==expected['display_references']
                      assert observed['suppressed_references']==expected['suppressed_references']
                      if position==0:
                          assert observed['action']==DENY
                          continue
                      request_path=folder/f'request-{position}.json'
                      body_path=folder/f'body-{position}.json'
                      output=folder/f'decision-{position}.json'
                      request_path.write_text(json.dumps(req))
                      body_path.write_text(json.dumps(body))
                      assert main(['--role',role,'--request-json',str(request_path),
                                   '--response-json',str(body_path),
                                   '--reviewed-bundle',str(bundle),'--out',str(output)])==0
                      report=json.loads(output.read_text())
                      safe=report['security_reference_consumption']
                      assert safe['action']==ALLOW and safe['display_count']==5 and safe['suppressed_count']==1
                      assert report['reviewed_source_loaded_offline'] is True
                      assert report['original_external_capture_git_verified'] is False
                      assert report['current_advisory_freshness_verified'] is False
                      assert 'advisoryKeys' not in output.read_text()
          # Constructed adversarial mutation, NOT a new original observation.
          forged=deepcopy(json.loads(bundle.read_text()))
          ident=next(iter(forged['original_reviewed_source_bytes_base64']))
          forged['original_reviewed_source_bytes_base64'][ident]='e30='
          with TemporaryDirectory() as directory:
              bad=Path(directory)/'tampered.json'
              bad.write_text(json.dumps(forged))
              try:
                  load_bundle(bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError('tampered original Git blob improperly accepted')
          print('Online original 3-capture results EXACTLY match offline six-source consumption; 2 local CLI calls accepted, no outside provenance promoted, mutated cached Git bytes refused.')
          PY
      - name: Publish bounded real original decision impact and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('original-source-bound-app-reference-gate/ORIGINAL-THREE-REAL-PROVIDER-GIT-REVIEWED-DISPLAY-DECISIONS.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Actual original outside security output application consumption\n\n')
            f.write('Three original Git-SHA1 authenticated external reported-paid Miner captures and six Git-SHA1 authenticated reviewed GHSA records. One routed 100-unscoped-feed rejected; two direct outputs sanitized to **5 displayed review references and one independently version-inapplicable suppressed reference each** (10 displayed / 2 suppressed, one distinct inapplicable advisory).\n\n')
            f.write('**Not a same-Intent leaderboard:** original routed intent SECURITY_REVIEW_GENERAL, direct recorded receipts SECURITY_REVIEW. Not independently verified miner ownership, paid settlement, expert gold, advisory completeness, external adoption or registered evaluator. The result permits DISPLAY only, never security clearance.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase5z-real-three-external-miner-six-independent-reviewed-app-reference-decisions
          path: original-source-bound-app-reference-gate/
          retention-days: 90
          if-no-files-found: error
