name: Phase 4C - judge release and real source-model proof
on:
  push:
    paths:
      - 'src/falsum/phase4c_judge_proof.py'
      - 'src/falsum/phase4c_release.py'
      - 'src/falsum/templates/phase4c_judge_model_proof.html'
      - 'src/falsum/templates/firma_editorial_evidence_lab.html'
      - 'tests/test_phase4c_judge_release.py'
      - 'tests/browser/phase4c_judge_proof.cjs'
      - '.github/workflows/phase4c-judge-release.yml'
      - 'vercel.json'
      - 'docs/H2_FINAL_ENTRY_DRAFT.md'
      - 'docs/H2_EVALUATORS_JUDGE_PACK.md'
      - 'docs/H2_EVALUATORS_DEMO_STORYBOARD.md'
      - 'README.md'
  pull_request:
    paths:
      - 'src/falsum/phase4c_judge_proof.py'
      - 'src/falsum/phase4c_release.py'
      - 'src/falsum/templates/phase4c_judge_model_proof.html'
      - 'src/falsum/templates/firma_editorial_evidence_lab.html'
      - 'tests/test_phase4c_judge_release.py'
      - 'tests/browser/phase4c_judge_proof.cjs'
      - '.github/workflows/phase4c-judge-release.yml'
      - 'vercel.json'
      - 'docs/H2_FINAL_ENTRY_DRAFT.md'
      - 'docs/H2_EVALUATORS_JUDGE_PACK.md'
      - 'docs/H2_EVALUATORS_DEMO_STORYBOARD.md'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-contract:
    name: Build release & verify source integrity / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check actual score identity, hypothetical fixtures and release safety
        run: |
          set -euo pipefail
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase4c_judge_release.py' -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase3q_mission_lab.py' -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase4a_recorded_evidence.py' -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase4b_reference_judge.py' -v
      - name: Build release artifacts without secrets or third-party network
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.phase4c_release --out-dir judge-release
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('judge-release')
          data=json.loads((r/'proof/ACTUAL-RECORDED-FOUNDATION-MODEL-SCORES.json').read_text())
          assert data['recorded_inference_not_live'] is True
          assert data['real_model_score_inputs']==12
          assert data['model_matches_narrow_source_facts']==3
          assert data['complete_factual_reversals']==0
          assert data['model_registered_to_telegraph'] is False
          assert data['independently_expert_adjudicated'] is False
          source=json.loads((r/'ACTUAL-SYNTHETIC-RUNTIME-PROOF.json').read_text())
          assert source['actual_third_party_mission_apps_verified']==0
          assert source['actual_evaluator_model_scoring_executed'] is False
          assert (r/'index.html').is_file() and (r/'proof/index.html').is_file()
          print('Two honest, static judge experiences verified.')
          PY
  browser-acceptance:
    name: Chromium / desktop, mobile, keyboard and touch
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact Chromium and playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build both honest judge routes
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.phase4c_release --out-dir public
          node --check tests/browser/phase4c_judge_proof.cjs
          node --check tests/browser/phase3t_judge_flow.cjs
      - name: Test unchanged three-case challenge and new recorded-model proof
        env:
          TEST_SITE_DIR: ${{ github.workspace }}/public
        run: |
          set -euo pipefail
          node tests/browser/phase3t_judge_flow.cjs
          node tests/browser/phase4c_judge_proof.cjs
      - name: Archive real evidence displays and 1440/390/320 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PHASE4C-JUDGE-REAL-PROOF-CHALLENGE-CHROMIUM-SCREENSHOTS
          path: |
            public/index.html
            public/proof/index.html
            public/ACTUAL-SYNTHETIC-RUNTIME-PROOF.json
            public/proof/ACTUAL-RECORDED-FOUNDATION-MODEL-SCORES.json
            public/proof/phase4c-*.png
            public/phase3t-*.png
          if-no-files-found: warn
          retention-days: 90
