name: Phase 5BC - ACP buyer history integration
on:
  pull_request:
    paths:
      - 'src/falsum/phase5bc_acp_buyer_history.py'
      - 'src/falsum/phase5bb_acp_security_acceptance.py'
      - 'data/phase5bc-acp-buyer-history-protocol.json'
      - 'tests/test_phase5bc_acp_buyer_history.py'
      - '.github/workflows/phase5bc-acp-buyer-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Verify upstream contract and constructed buyer-history controls
        run: python -m unittest discover -s tests -p 'test_phase5bc_acp_buyer_history.py' -v
