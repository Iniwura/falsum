name: Phase 5AX - real response CWE reference integrity
on:
  pull_request:
    paths:
      - 'src/falsum/phase5ax_original_cwe_integrity.py'
      - 'tests/test_phase5ax_original_cwe_integrity.py'
      - 'data/phase5ax-original-cwe-integrity-protocol.json'
      - '.github/workflows/phase5ax-original-cwe-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Test exact title identity and abstention
        run: python -m unittest discover -s tests -p 'test_phase5ax_original_cwe_integrity.py' -v
      - name: Compare complete authentic recorded responses against versioned MITRE registry
        run: python -m falsum.phase5ax_original_cwe_integrity --out phase5ax-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5ax-original-cwe-integrity
          path: phase5ax-report.json
          if-no-files-found: error
