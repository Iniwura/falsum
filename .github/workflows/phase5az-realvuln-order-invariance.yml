name: Phase 5AZ - external RealVuln scorer order invariance
on:
  pull_request:
    paths:
      - 'src/falsum/phase5az_realvuln_order_invariance.py'
      - 'tests/test_phase5az_realvuln_order_invariance.py'
      - 'data/phase5az-realvuln-protocol.json'
      - '.github/workflows/phase5az-realvuln-order-invariance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Verify assignment controls
        run: python -m unittest discover -s tests -p 'test_phase5az_realvuln_order_invariance.py' -v
      - name: Compare actual published reports and input-order permutations
        run: python -m falsum.phase5az_realvuln_order_invariance --out phase5az-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5az-realvuln-order-invariance
          path: phase5az-report.json
          if-no-files-found: error
