name: Phase 5BB - ACP scoped security acceptance
on:
  pull_request:
    paths:
      - 'src/falsum/phase5bb_acp_security_acceptance.py'
      - 'data/phase5bb-acp-security-contract.json'
      - 'tests/test_phase5bb_acp_security_acceptance.py'
      - '.github/workflows/phase5bb-acp-security-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Replay bounded acceptance and adversarial controls against original advisory
        run: python -m unittest discover -s tests -p 'test_phase5bb_acp_security_acceptance.py' -v
