name: RESEARCH ONLY - Context curriculum A/B pilot
on:
  push:
    paths:
      - 'src/falsum/context_curriculum.py'
      - 'tests/test_context_curriculum.py'
      - '.github/workflows/research-context-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-model:
    name: Train GHSA plus TRAIN-only PR context (NOT eligible)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set isolated runner output paths
        shell: bash
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/falsum-context" >> "$GITHUB_ENV"
          echo "MODEL_DIR=$RUNNER_TEMP/falsum-context-model" >> "$GITHUB_ENV"
      - name: Verify research-only data audit and context-split tests (offline)
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p test_research_pilot.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_context_curriculum.py -v
      - name: Reconstruct archived GHSA draft data from immutable records
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.advisory_corpus data/advisory-queue.json --out "$DATA_DIR"
          PYTHONPATH=src python -m falsum.review_gate data/advisory-queue.json "$DATA_DIR/DRAFT-ONLY-corpus.json" --audit-only
          PYTHONPATH=src python -m falsum.grounded_eval data/advisory-queue.json "$DATA_DIR/DRAFT-ONLY-corpus.json" --out "$DATA_DIR/grounded"
          PYTHONPATH=src python -m falsum.research_pilot data/advisory-queue.json "$DATA_DIR" --manifest "$DATA_DIR/PILOT-QUARANTINE-MANIFEST.json"
      - name: Prepare source-verified PR TRAIN-only augmented curriculum
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.context_curriculum \
            --advisory-train "$DATA_DIR/grounded/DRAFT-grounded-train.jsonl" \
            --pilot-manifest "$DATA_DIR/PILOT-QUARANTINE-MANIFEST.json" \
            --pr-benchmark data/draft-pr-benchmark.json \
            --casebook data/draft-scenarios.json \
            --out "$DATA_DIR/DRAFT-CONTEXT-TRAIN.jsonl" \
            --manifest "$DATA_DIR/CONTEXT-QUARANTINE-MANIFEST.json"
      - name: Checkout immutable official Telegraph V2 model trainer
        uses: actions/checkout@v4
        with:
          repository: telegraphprotocol/telegraph-wasm-baseline
          ref: 5fa5d68bbcf76aaa2093c5d0578f53462bc0e36e
          path: telegraph-kit
          persist-credentials: false
      - name: Install CPU PyTorch and official kit model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r telegraph-kit/requirements.txt 'transformers>=4.48,<5' 'numpy>=1.26,<3' 'peft>=0.14,<1'
          mkdir -p "$DATA_DIR"
          python -m pip freeze > "$DATA_DIR/RESEARCH-DEPENDENCIES.txt"
      - name: Require upstream shortcut gate to pass before training
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=telegraph-kit python -m wide_runtime.train_adapter \
            --intent SECURITY_REVIEW_GENERAL \
            --data "$DATA_DIR/DRAFT-CONTEXT-TRAIN.jsonl" --check-data \
            2>&1 | tee "$DATA_DIR/UPSTREAM-DATA-GATE.log"
      - name: Train actual ModernBERT LoRA for research ONLY (CPU, 1 epoch)
        id: train
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$MODEL_DIR"
          PYTHONPATH=telegraph-kit python -m wide_runtime.train_adapter \
            --intent SECURITY_REVIEW_GENERAL \
            --data "$DATA_DIR/DRAFT-CONTEXT-TRAIN.jsonl" \
            --val-data "$DATA_DIR/grounded/DRAFT-grounded-validation.jsonl" \
            --test-data "$DATA_DIR/grounded/DRAFT-grounded-holdout.jsonl" \
            --max-length 512 --batch-size 1 --eval-batch 1 --grad-accum 8 --epochs 1 \
            --out "$MODEL_DIR/SECURITY_REVIEW_GENERAL" \
            2>&1 | tee "$DATA_DIR/RESEARCH-TRAINING.log"
          status=${PIPESTATUS[0]}
          echo "upstream_training_exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Official trainer exit: $status (0=model passed 6-case holdout; 1=failed evaluation; 2=tooling error)" >> "$GITHUB_STEP_SUMMARY"
          echo "A/B variant: 52 GHSA TRAIN cases plus 6 PR TRAIN-only counterfactuals (UNREVIEWED). Original validation and test cases remain unchanged. NOT network eligible." >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -gt 1 ]; then
            echo 'Tooling/data error: investigate the training log.'
            exit "$status"
          fi
          # Exit code 1 is a genuine failed model evaluation, not a tool failure.
          # Record the result; never relabel the model as passing.
          exit 0
      - name: Measure REAL model on counterfactual PRs with answer-only ablation
        if: steps.train.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          adapter="$MODEL_DIR/SECURITY_REVIEW_GENERAL/adapter"
          if [ ! -f "$adapter/adapter_config.json" ] || [ ! -f "$adapter/adapter_model.safetensors" ]; then
            echo 'No real trained PEFT checkpoint available for scoring.' | tee "$DATA_DIR/MODEL-MISSING.txt"
            exit 0
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/telegraph-kit" python -m falsum.model_eval \
            --benchmark data/draft-pr-benchmark.json \
            --casebook data/draft-scenarios.json \
            --adapter "$adapter" \
            --report "$DATA_DIR/COUNTERFACTUAL-MODEL-RESULT.json" \
            2>&1 | tee "$DATA_DIR/COUNTERFACTUAL-MODEL-LOG.txt"
          status=${PIPESTATUS[0]}
          echo "Counterfactual model evaluation exit: $status (failure is a research result, not a fabricated score)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Publish fail-closed research decision from actual model scoring
        if: steps.train.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          official="$MODEL_DIR/SECURITY_REVIEW_GENERAL/result.json"
          counterfactual="$DATA_DIR/COUNTERFACTUAL-MODEL-RESULT.json"
          pilot="$DATA_DIR/CONTEXT-QUARANTINE-MANIFEST.json"
          if [[ ! -f "$official" || ! -f "$counterfactual" || ! -f "$pilot" ]]; then
            echo "Research decision: INCOMPLETE. Missing trained-model evidence." >> "$GITHUB_STEP_SUMMARY"
            if [[ "${{ steps.train.outputs.upstream_training_exit_code }}" == "0" ]]; then
              echo 'Trainer reported success but complete real-model evidence was not produced.' >&2
              exit 1
            fi
            exit 0
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m falsum.pilot_decision \
            --official "$official" \
            --counterfactual "$counterfactual" \
            --pilot "$pilot" \
            --output "$DATA_DIR/PILOT-DECISION.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads((Path(os.environ["DATA_DIR"]) / "PILOT-DECISION.json").read_text())
          s = r["research_counterfactual"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### FALSUM: model pilot verdict (research only)\n\n")
              out.write(f"Official trainer: {r['official_training']['verdict']} on {r['official_training']['test_pairs']} draft test pairs.\n\n")
              out.write(f"Counterfactual context reversals: {s['families_correct_in_both_contexts']}/{s['total_families']} family pairs.\n\n")
              out.write(f"Decision: **{r['status']}**, network eligible: **NO**, registration authorized: **NO**.\n")
          PY
      - name: Save research-only evidence and actual checkpoint (never publish or register)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QUARANTINED-FALSUM-CONTEXT-EXPERIMENT-NOT-SUBMITTABLE
          path: |
            ${{ runner.temp }}/falsum-context/PILOT-QUARANTINE-MANIFEST.json
            ${{ runner.temp }}/falsum-context/CONTEXT-QUARANTINE-MANIFEST.json
            ${{ runner.temp }}/falsum-context/DRAFT-CONTEXT-TRAIN.jsonl
            ${{ runner.temp }}/falsum-context/RESEARCH-DEPENDENCIES.txt
            ${{ runner.temp }}/falsum-context/UPSTREAM-DATA-GATE.log
            ${{ runner.temp }}/falsum-context/RESEARCH-TRAINING.log
            ${{ runner.temp }}/falsum-context/COUNTERFACTUAL-MODEL-RESULT.json
            ${{ runner.temp }}/falsum-context/PILOT-DECISION.json
            ${{ runner.temp }}/falsum-context/COUNTERFACTUAL-MODEL-LOG.txt
            ${{ runner.temp }}/falsum-context/MODEL-MISSING.txt
            ${{ runner.temp }}/falsum-context-model/SECURITY_REVIEW_GENERAL/result.json
            ${{ runner.temp }}/falsum-context-model/SECURITY_REVIEW_GENERAL/adapter/
          if-no-files-found: warn
          retention-days: 7
