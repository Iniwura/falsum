name: Independent Reviewer Replay - public evidence only
# On a fork, enable GitHub Actions and use "Run workflow" from its Actions tab.
# Running this in the author's repository is NOT independent developer adoption.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/independent-reviewer-replay.yml'
      - 'docs/INDEPENDENT_REVIEWER_START_HERE.md'
      - 'examples/**'
      - 'data/**'
      - 'evidence/**'
      - 'src/falsum/**'
      - 'tests/**'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  reproduce-two-original-evidence-gates:
    name: Public original-source replay - no secrets, wallet, payment or provider account
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.14'
      - name: Reject constructed evidence substitution and wrong canonical request
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase5ab_original_receipt_comparability.py' -v
          python -m unittest discover -s tests -p 'test_phase5aa_offline_reviewed_bundle.py' -v
      - name: Replay two constructive falsification challenges (no genuine source mutation)
        run: |
          set -euo pipefail
          python examples/reviewer_challenges.py --challenge direct-vs-routed
          python examples/reviewer_challenges.py --challenge tampered-lock
          python -m unittest discover -s tests -p 'test_phase5af_reviewer_challenge_recipes.py' -v
      - name: Retrieve and verify 12 authentic third-party Git source blobs
        run: |
          set -euo pipefail
          mkdir -p reviewer-results
          python -m falsum.cli audit-receipt-comparability \
            --out reviewer-results/original-12-receipt-comparability.json
      - name: Authenticate six original GitHub-reviewed advisory source files
        run: |
          set -euo pipefail
          python -m falsum.cli bundle-reviewed-advisories \
            --out /tmp/falsum-reviewed-historical-sources.json
      - name: Reproduce a local display-only filtering decision (CONSTRUCTED input)
        run: |
          set -euo pipefail
          python -m falsum.cli filter-security-references \
            --role direct_deps_dev_ghsa \
            --request-json examples/phase5aa-constructed-request.json \
            --response-json examples/phase5aa-constructed-response.json \
            --reviewed-bundle /tmp/falsum-reviewed-historical-sources.json \
            --out reviewer-results/constructed-local-display-decision.json
      - name: Reproduce new-package source-backed decisions and uncertainty (CONSTRUCTED targets)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase5ag_reviewed_reference_evaluator.py' -v
          python -m falsum.cli review-verified-references \
            --ecosystem npm --package axios --version 1.5.0 \
            --reference GHSA-wf5p-g6vw-rhxx \
            --out reviewer-results/constructed-axios-source-decision.json
          python -m falsum.cli review-verified-references \
            --ecosystem RubyGems --package rack --version 3.2.5 \
            --reference GHSA-xj5v-6v4g-jfw6 \
            --reference GHSA-7mqq-6cf9-v2qp \
            --out reviewer-results/constructed-rack-source-decisions.json
          python -m falsum.cli review-verified-references \
            --ecosystem RubyGems --package rack --version 3.0.5 \
            --reference GHSA-7mqq-6cf9-v2qp \
            --out reviewer-results/constructed-rack-prerelease-uncertainty.json
      - name: Reproduce original cross-app availability and complete external-label policy comparison
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase5aj_cross_app_evidence.py' -v
          python -m unittest discover -s tests -p 'test_phase5ak_external_label_baselines.py' -v
          python -m falsum.phase5aj_cross_app_evidence --out reviewer-results/original-cross-app-availability.json
          python -m falsum.phase5ak_external_label_baselines --out reviewer-results/original-external-label-policy-comparison.json
      - name: Assert original external count, sanitized output and no false independence claim
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          folder=Path('reviewer-results')
          original=folder/'original-12-receipt-comparability.json'
          example=folder/'constructed-local-display-decision.json'
          o=json.loads(original.read_text())
          e=json.loads(example.read_text())
          assert o['original_outside_git_authenticated_capture_count']==12
          assert o['original_explicit_canonical_routed_request_and_receipt_count']==2
          assert o['original_direct_noncanonical_request_with_canonical_receipt_count']==2
          assert o['original_paid_http200_with_noncanonical_receipt_count']==6
          assert o['original_failed_requests_without_successful_receipts_count']==2
          assert o['same_canonical_request_multi_miner_candidate_count']==0
          assert o['semantic_security_accuracy_gold']==0
          assert o['independent_developer_adoption_proved'] is False
          assert o['original_full_third_party_response_body_republished'] is False
          assert len(o['source_provenance_observations'])==12
          assert all(x['original_source_verified_by_git_blob'] is True for x in o['source_provenance_observations'])
          # Three new reviewed source blobs are separately authenticated by
          # the standalone evaluator; these inputs are CONSTRUCTED locally.
          axios=json.loads((folder/'constructed-axios-source-decision.json').read_text())
          rack=json.loads((folder/'constructed-rack-source-decisions.json').read_text())
          uncertain=json.loads((folder/'constructed-rack-prerelease-uncertainty.json').read_text())
          assert [x['decision'] for x in axios['reference_decisions']]==['VERIFIED_APPLICABLE']
          assert [x['decision'] for x in rack['reference_decisions']]==[
              'VERIFIED_INAPPLICABLE','VERIFIED_APPLICABLE']
          assert [x['decision'] for x in uncertain['reference_decisions']]==[
              'INSUFFICIENT_EVIDENCE']
          for review in (axios,rack,uncertain):
              assert review['original_git_reviewed_advisories_verified']==3
              assert review['source_roster_git_blob_sha1']=='c396cede959429ff32eff499156961e17546b3e3'
              assert review['coverage_is_complete'] is False
              assert review['security_clearance_granted'] is False
              assert review['independent_expert_appsec_gold']==0
              assert review['new_actual_miner_result_evaluated'] is False
              assert review['new_independent_developer_adoption_proved'] is False
              assert review['registered_telegraph_network_evaluator'] is False
              assert review['current_advisory_freshness_verified'] is False
              assert all(row['source_is_current_feed'] is False
                         for row in review['reference_decisions'])
          d=e['security_reference_consumption']
          assert d['display_count']==5 and d['suppressed_count']==1
          assert d['suppressed_references'][0]['verified_ghsa_id']=='GHSA-f23m-r3pf-42rh'
          assert e['reviewed_source_loaded_offline'] is True
          assert e['original_external_capture_git_verified'] is False
          assert e['current_advisory_freshness_verified'] is False
          assert d['original_external_capture_git_verified'] is False
          for p in (original,example):
              content=p.read_text()
              assert '"bodyText"' not in content
              assert '"payer"' not in content
              assert '"advisoryKeys"' not in content
          cross=json.loads((folder/'original-cross-app-availability.json').read_text())
          scale=json.loads((folder/'original-external-label-policy-comparison.json').read_text())
          assert cross['original_git_sources_authenticated']==7
          assert len(cross['truvian'])==2
          assert all(x['diagnostic']=='EXPLICIT_NO_EVIDENCE_CONTRADICTION' and x['security_clearance_granted'] is False for x in cross['truvian'])
          assert cross['gig_planted']['counts']['security_explicit_failures']==10
          assert cross['gig_planted']['counts']['ship_with_known_planted_bug']==1
          assert cross['gig_audited']['counts']['security_absent_without_explicit_failure']==7
          assert cross['gig_planted']['archived_receipts_matched']+cross['gig_audited']['archived_receipts_matched']==41
          assert cross['security_clearance_granted'] is False
          assert cross['new_network_ranking_proved'] is False
          assert cross['gig_planted']['live_settlement_verified'] is False
          assert cross['gig_audited']['live_settlement_verified'] is False
          assert scale['source_git_objects_authenticated']==3
          assert scale['summary']['unique_cases']==129 and scale['summary']['all_decisions']==158
          assert scale['summary']['purchases']==202 and scale['summary']['errors']==70
          assert scale['summary']['archived_settled']==201 and scale['summary']['archived_not_found']==1
          metrics=scale['summary']['latest_metrics']
          assert metrics['count_only']['vulnerable:PASS']==8
          assert metrics['falsum_consumer']==metrics['verdict_only']
          assert metrics['falsum_consumer'].get('vulnerable:PASS',0)==0
          assert metrics['falsum_consumer']['audited:FLAG']==5
          assert metrics['count_only']['audited:FLAG']==1
          assert scale['better_than_verdict_baseline'] is False
          assert scale['security_clearance_granted'] is False
          assert scale['live_settlement_verified'] is False
          assert all(v is True for v in scale['limits'].values())
          assert all(v is False for v in cross['limits'].values())
          for report in (cross, scale):
              for forbidden in ('payer','summary','result','receipt_hash','bodyText'):
                  # The top-level scale aggregate is explicitly named summary;
                  # no raw response fields or payer metadata are published.
                  if forbidden!='summary':
                      assert '"'+forbidden+'":' not in json.dumps(report)
          result={
            'schema_version':1,
            'status':'FALSUM_PUBLIC_REVIEWER_REPLAY_COMPLETED_NO_INDEPENDENT_ACCEPTANCE',
            'source_replay_original_verified_git_blobs':12,
            'source_replay_ghsa_git_blobs_verified':6,
            'separate_multiecosystem_reviewed_ghsa_git_blobs_verified':3,
            'cross_app_original_git_objects_verified':7,
            'scale_original_git_objects_verified':3,
            'scale_latest_cases':129,
            'scale_historical_receipt_statuses':{'SETTLED':201,'NOT_FOUND':1},
            'scale_count_only_vulnerable_pass_predictions':8,
            'scale_falsum_vulnerable_pass_predictions':0,
            'scale_falsum_equals_verdict_only':True,
            'scale_live_settlement_verified':False,
            'sha256_cross_app_report':hashlib.sha256(
              (folder/'original-cross-app-availability.json').read_bytes()).hexdigest(),
            'sha256_external_label_policy_report':hashlib.sha256(
              (folder/'original-external-label-policy-comparison.json').read_bytes()).hexdigest(),
            'new_package_inputs_are_constructed':True,
            'new_reviewed_reference_expected_statuses':{
              'npm_axios_1_5_0':['VERIFIED_APPLICABLE'],
              'rubygems_rack_3_2_5':['VERIFIED_INAPPLICABLE','VERIFIED_APPLICABLE'],
              'rubygems_rack_3_0_5':['INSUFFICIENT_EVIDENCE'],
            },
            'same_exact_canonical_multi_miner_pairs':0,
            'constructed_local_display_count':5,
            'constructed_local_suppressed_count':1,
            'original_external_paid_settlement_verified':False,
            'new_independent_appsec_gold':0,
            'registered_telegraph_network_evaluator':False,
            'claim_of_external_developer_adoption':False,
            'reviewer_attestation_or_identity_verified':False,
            'github_workflow_repository':os.environ.get('GITHUB_REPOSITORY',''),
            'github_workflow_commit':os.environ.get('GITHUB_SHA',''),
            'sha256_original_receipt_report':hashlib.sha256(original.read_bytes()).hexdigest(),
            'sha256_constructed_filter_report':hashlib.sha256(example.read_bytes()).hexdigest(),
            'sha256_constructed_axios_report':hashlib.sha256(
              (folder/'constructed-axios-source-decision.json').read_bytes()).hexdigest(),
            'sha256_constructed_rack_report':hashlib.sha256(
              (folder/'constructed-rack-source-decisions.json').read_bytes()).hexdigest(),
            'sha256_constructed_prerelease_report':hashlib.sha256(
              (folder/'constructed-rack-prerelease-uncertainty.json').read_bytes()).hexdigest(),
          }
          (folder/'reproduction-manifest.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Upload only public-safe outputs (not source bundles, Miner bodies or user data)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: falsum-public-reviewer-replay
          path: reviewer-results/
          if-no-files-found: error
          retention-days: 30
      - name: Provide review instructions
        shell: bash
        run: |
          echo '## Public reviewer replay' >> "$GITHUB_STEP_SUMMARY"
          echo 'The original sources were authenticated against their immutable Git blob identities. The constructed filtering sample is NOT an independent Miner result.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The public-safe artifact includes the receipt census, constructed package exercises, original cross-app availability audit and original 129-case policy comparison, with each report fingerprinted in the manifest.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The multi-ecosystem results authenticate three separate pinned GitHub-reviewed source blobs. They are not independent expert security labels or a current complete advisory feed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A forked workflow alone does not prove independent authorship, accuracy of source labels, confirmed payment or adoption. To challenge or contribute, use the independent reviewer guide and issue form.' >> "$GITHUB_STEP_SUMMARY"
