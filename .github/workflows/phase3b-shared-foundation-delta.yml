name: Phase 3B - export OLD research checkpoint to current shared Foundation LoRA format
on:
  push:
    paths:
      - '.github/workflows/phase3b-shared-foundation-delta.yml'
      - 'src/falsum/phase3b_delta_readiness.py'
      - 'tests/test_phase3b_delta_readiness.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check-research-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact foundation and historical model identities before any downloads
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p test_phase3b_delta_readiness.py -v
      - name: Obtain official pinned shared Foundation exporter
        uses: actions/checkout@v4
        with:
          repository: telegraphprotocol/telegraph-wasm-baseline
          ref: 1ed063e2f0066cfaf0e124d66ec6a17b7a6121fd
          path: telegraph-kit
          persist-credentials: false
      - name: Restore real existing Phase 2U research-trained LoRA (NO retraining)
        uses: actions/download-artifact@v4
        with:
          name: QUARANTINED-FALSUM-PHASE2U-CONTEXT-LORA-RESEARCH
          run-id: 41283929744
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/falsum-3b/old-research-checkpoint
      - name: Verify checkpoint SHA identities and reject any missing trained reward head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/falsum-3b/out"
          PYTHONPATH=src python -m falsum.phase3b_delta_readiness \
            --root "$RUNNER_TEMP/falsum-3b/old-research-checkpoint" \
            --out "$RUNNER_TEMP/falsum-3b/out/REAL-OLD-CHECKPOINT-COMPATIBILITY.json"
      - name: Download exact official foundation manifest, verify published SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/telegraphprotocol/telegraph-foundation/releases/download/modernbert-base-lora16-v1/foundation.json' \
            -o "$RUNNER_TEMP/falsum-3b/foundation.json"
          echo "f7de64b999acd3f735118fbe5999abf251fdf188f9797e3a4e36c54ee9e4dbbe  $RUNNER_TEMP/falsum-3b/foundation.json" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 \
            'https://github.com/telegraphprotocol/telegraph-foundation/releases/download/modernbert-base-lora16-v1/tokenizer.json' \
            -o "$RUNNER_TEMP/falsum-3b/official-tokenizer.json"
          echo "67bc76f8b9386efba1a761c1c8e5ad439fd0eaf1c2826e9dd1a205c7af4dc456  $RUNNER_TEMP/falsum-3b/official-tokenizer.json" | sha256sum -c -
      - name: Install CPU-only dependencies needed for OFFICIAL delta export
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' 'peft>=0.14,<1' 'numpy>=1.26,<3' 'safetensors>=0.4.5'
      - name: Semantic tokenizer equality gate before preparing export-only copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,hashlib,shutil
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"falsum-3b"
          old=list((root/"old-research-checkpoint").rglob("adapter_config.json"))
          assert len(old)==1, "exactly one original trained adapter expected"
          source=old[0].parent
          original=source/"tokenizer.json"
          official=root/"official-tokenizer.json"
          before=json.loads(original.read_text(encoding="utf-8"))
          current=json.loads(official.read_text(encoding="utf-8"))
          differences=[k for k in sorted(set(before)|set(current)) if before.get(k)!=current.get(k)]
          if differences not in ([],["truncation"]):
              print("TOKENIZER UNSAFE SEMANTIC DIFFERENCES:",differences,flush=True)
              raise SystemExit("Old and node vocabulary/normalizer/postprocessor/tokenization differ; deny export")
          old_trunc=before.get("truncation")
          node_trunc=current.get("truncation")
          allowed=("direction","strategy","stride","max_length")
          if (not isinstance(old_trunc,dict) or set(old_trunc)!=set(allowed)
                  or old_trunc!=dict(direction="Right",strategy="LongestFirst",stride=0,max_length=512)):
              raise SystemExit("Training tokenizer truncation config not the proven 512-token right policy")
          if (not isinstance(node_trunc,dict) or set(node_trunc)!=set(allowed)
                  or node_trunc["direction"]!="Right"
                  or node_trunc["strategy"]!="LongestFirst"
                  or node_trunc["stride"]!=0
                  or type(node_trunc["max_length"]) is not int
                  or node_trunc["max_length"]<512):
              raise SystemExit("Official tokenizer has incompatible truncation direction/strategy or fewer than 512 tokens")
          print("Verified token-vocabulary and tokenizer semantics identical except explicit max-length policy.",
                "previous=",old_trunc,"official=",node_trunc,flush=True)
          copy=root/"export-only-model"
          shutil.copytree(source,copy)
          shutil.copy2(official,copy/"tokenizer.json")
          assert json.loads((copy/"tokenizer.json").read_text())==current
          details={
              "old_checkpoint_tokenizer_sha256":hashlib.sha256(original.read_bytes()).hexdigest(),
              "node_tokenizer_sha256":hashlib.sha256(official.read_bytes()).hexdigest(),
              "semantic_tokenizer_json_comparison":"EQUAL_EXCEPT_VERIFIED_RIGHTWARD_TRUNCATION_MAX_LENGTH",
              "original_truncation":old_trunc,"official_truncation":node_trunc,
              "network_input_max_tokens":512,
              "original_checkpoint_bytes_unchanged":True,
              "canonical_tokenizer_substituted_in_separate_export_only_copy":True,
              "research_only":True,"independent_security_accuracy_verified":False,
              "network_eligible":False,
          }
          (root/"out"/"TOKENIZER-SEMANTIC-COMPATIBILITY.json").write_text(json.dumps(details,indent=2)+"\n")
          PY
      - name: Export actual trained LoRA into 2026-11-01 node delta package (no new training)
        shell: bash
        run: |
          set -euo pipefail
          adapter="$RUNNER_TEMP/falsum-3b/export-only-model"
          test -s "$adapter/adapter_model.safetensors"
          PYTHONPATH=telegraph-kit python -m float_runtime.export_adapter \
            --adapter "$adapter" --intent SECURITY_REVIEW --class hybrid \
            --foundation "$RUNNER_TEMP/falsum-3b/foundation.json" \
            --out "$RUNNER_TEMP/falsum-3b/out/SECURITY_REVIEW.safetensors"
          test -s "$RUNNER_TEMP/falsum-3b/out/SECURITY_REVIEW.safetensors"
      - name: Official current Telegraph Go structural parser checks exact delta and hash
        shell: bash
        working-directory: telegraph-kit
        run: |
          set -euo pipefail
          go run ./cmd/adapterbuild lora \
            --intent SECURITY_REVIEW \
            --package "$RUNNER_TEMP/falsum-3b/out/SECURITY_REVIEW.safetensors" \
            --foundation "$RUNNER_TEMP/falsum-3b/foundation.json" \
            --out "$RUNNER_TEMP/falsum-3b/out" \
            | tee "$RUNNER_TEMP/falsum-3b/out/OFFICIAL-STRUCTURAL-CHECK.json"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"falsum-3b/out"
          x=json.loads((root/"OFFICIAL-STRUCTURAL-CHECK.json").read_text())
          p=root/"SECURITY_REVIEW.safetensors"
          assert x["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert x["class"]=="hybrid" and x["intent"]=="SECURITY_REVIEW"
          assert x["keccak256"].startswith("0x")
          assert x["bytes"]==p.stat().st_size
          readiness=json.loads((root/"REAL-OLD-CHECKPOINT-COMPATIBILITY.json").read_text())
          assert readiness["research_only"] is True
          assert readiness["original_training_source"]=="PHASE2U-AI-PROVISIONAL"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### FALSUM current 2026 shared-Foundation delta export\n\n")
              f.write("Real saved Phase2U ModernBERT LoRA converted to a genuine safetensors package; official pinned Telegraph Go adapter checker passed.\n\n")
              f.write("This is **structural compatibility only**, not hidden network evaluation, independent security-model accuracy, running executor, or registration. The old model failed context-transfer benchmarks and remains QUARANTINED.\n\n")
              f.write(f"Official SHA256: {x['sha256']}; keccak: {x['keccak256']}\n")
          PY
      - name: Save quarantined real delta artifact and exact structural evidence (not registered)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QUARANTINED-FALSUM-PHASE3B-RESEARCH-DELTA-NOT-NETWORK-REGISTERED
          path: |
            ${{ runner.temp }}/falsum-3b/out/
            ${{ runner.temp }}/falsum-3b/foundation.json
          retention-days: 14
          if-no-files-found: warn
