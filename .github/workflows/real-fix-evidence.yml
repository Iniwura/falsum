name: Real upstream security-fix evidence (research only)
on:
  push:
    paths:
      - 'src/falsum/real_fix_corpus.py'
      - 'tests/test_real_fix_corpus.py'
      - 'src/falsum/real_fix_replay.py'
      - 'tests/test_real_fix_replay.py'
      - 'src/falsum/pre_fix_challenges.py'
      - 'tests/test_pre_fix_challenges.py'
      - 'data/real-fix-queue.json'
      - '.github/workflows/real-fix-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    name: Pin real upstream patches + produce review packet (NO labels)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline malicious source/review-status tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_real_fix_corpus.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_real_fix_replay.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_pre_fix_challenges.py' -v
      - name: Fetch actual public commit objects and recheck pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/falsum-real-fixes"
          PYTHONPATH=src python -m falsum.real_fix_corpus \
            --queue data/real-fix-queue.json \
            --out "$RUNNER_TEMP/falsum-real-fixes/SOURCE-VERIFIED-NOT-LABELED.json" \
            --reviewer-out "$RUNNER_TEMP/falsum-real-fixes/EXTERNAL-REVIEW-QUESTIONS-NO-LABELS.json"
          PYTHONPATH=src python -m falsum.real_fix_replay \
            --evidence "$RUNNER_TEMP/falsum-real-fixes/SOURCE-VERIFIED-NOT-LABELED.json" \
            --out "$RUNNER_TEMP/falsum-real-fixes/PRE-POST-CODE-REPLAY-VERIFIED.json"
          mkdir -p "$RUNNER_TEMP/falsum-real-fixes/provenance" "$RUNNER_TEMP/falsum-model-prompts"
          PYTHONPATH=src python -m falsum.pre_fix_challenges \
            --evidence "$RUNNER_TEMP/falsum-real-fixes/SOURCE-VERIFIED-NOT-LABELED.json" \
            --public-out "$RUNNER_TEMP/falsum-model-prompts/UNLABELED-PRE-FIX-PROMPTS.json" \
            --provenance-out "$RUNNER_TEMP/falsum-real-fixes/provenance/REMEDIATION-AND-SOURCE-REFERENCES.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "falsum-real-fixes"
          a = json.loads((root / "SOURCE-VERIFIED-NOT-LABELED.json").read_text())
          b = json.loads((root / "EXTERNAL-REVIEW-QUESTIONS-NO-LABELS.json").read_text())
          c = json.loads((root / "PRE-POST-CODE-REPLAY-VERIFIED.json").read_text())
          prompts = json.loads((Path(os.environ["RUNNER_TEMP"]) / "falsum-model-prompts/UNLABELED-PRE-FIX-PROMPTS.json").read_text())
          provenance = json.loads((root / "provenance/REMEDIATION-AND-SOURCE-REFERENCES.json").read_text())
          assert a["source_verified"] == 3 and a["independent_human_reviews"] == 0
          assert a["network_eligible"] is False and a["training_authorized"] is False
          assert b["proposed_labels"] == 0 and b["human_reviews"] == 0
          assert len(b["questions"]) == len(a["cases"]) == 3
          assert c["cases_replayed"] == 3 and c["file_replays_verified"] == 6
          assert c["independent_human_reviews"] == 0 and c["network_eligible"] is False
          assert prompts["status"] == "UNREVIEWED_PUBLIC_PRE_FIX_CHALLENGE_NO_ANSWERS"
          assert prompts["network_eligible"] is False and prompts["sealed_holdout"] is False
          assert prompts["tokenizer_512_verified"] is False and prompts["independent_human_reviews"] == 0
          assert prompts["model_training_authorized"] is False
          assert len(prompts["prompts"]) >= 3
          assert all(set(item) == {"challenge_id", "prompt"} for item in prompts["prompts"])
          import hashlib
          prompt_sha = hashlib.sha256((Path(os.environ["RUNNER_TEMP"]) / "falsum-model-prompts/UNLABELED-PRE-FIX-PROMPTS.json").read_bytes()).hexdigest()
          assert provenance["public_prompt_sha256"] == prompt_sha
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### FALSUM real upstream patch corpus\n\n")
              out.write("3 immutable upstream security-fix commits + source and test patch blobs verified.\n\n")
              out.write("6 exact parent-to-fix source/test file transitions reconstructed and Git blob hashes rechecked.\n\n")
              out.write(f"{len(prompts['prompts'])} unreviewed public pre-fix-only code prompts generated. No remediation/advisory labels in model input.\n\n")
              out.write("**NO independently reviewed labels. NO eligible training data or network evaluator.**\n")
          PY
      - name: Upload source evidence + external review questions
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PUBLIC-REAL-FIXES-UNREVIEWED
          path: ${{ runner.temp }}/falsum-real-fixes/
          if-no-files-found: error
          retention-days: 30
      - name: Upload pre-fix prompts ONLY (no fix evidence or labels)
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PREFIX-ONLY-UNLABELED-CHALLENGES
          path: ${{ runner.temp }}/falsum-model-prompts/
          if-no-files-found: error
          retention-days: 30
