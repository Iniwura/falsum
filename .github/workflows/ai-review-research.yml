name: AI-assisted security review contrastive study (UNREVIEWED)

on:
  push:
    paths:
      - 'data/ai-review-drafts.json'
      - 'data/real-fix-queue.json'
      - 'src/falsum/ai_review_benchmark.py'
      - 'tests/test_ai_review_benchmark.py'
      - '.github/workflows/ai-review-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-review-benchmark:
    name: Reproduce real source and eight AI DRAFT pairs (no independent labels)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline adversarial draft tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_ai_review_benchmark.py' -v
      - name: Verify actual upstream commit and source/test patch identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-evidence" "$RUNNER_TEMP/ai-model-only" "$RUNNER_TEMP/ai-evidence-key"
          PYTHONPATH=src python -m falsum.real_fix_corpus \
            --queue data/real-fix-queue.json \
            --out "$RUNNER_TEMP/source-evidence/REAL-SOURCE-VERIFIED.json" \
            --reviewer-out "$RUNNER_TEMP/source-evidence/REVIEW-QUESTIONS.json"
          PYTHONPATH=src python -m falsum.real_fix_replay \
            --evidence "$RUNNER_TEMP/source-evidence/REAL-SOURCE-VERIFIED.json" \
            --out "$RUNNER_TEMP/source-evidence/REPLAY-VERIFIED.json"
      - name: Generate two opposing deployment contexts per project with real complete-input token check
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'transformers==4.57.1'
          PYTHONPATH=src python -m falsum.ai_review_benchmark \
            --specs data/ai-review-drafts.json \
            --queue data/real-fix-queue.json \
            --evidence "$RUNNER_TEMP/source-evidence/REAL-SOURCE-VERIFIED.json" \
            --questions-out "$RUNNER_TEMP/ai-model-only/AI-A-B-QUESTIONS-NO-KEY.json" \
            --key-out "$RUNNER_TEMP/ai-evidence-key/PROVISIONAL-AI-ANSWER-KEY-NOT-GROUND-TRUTH.json" \
            --token-out "$RUNNER_TEMP/ai-model-only/ACTUAL-512-TOKEN-FULL-A-B-INPUT-REPORT.json"
          PYTHONPATH=src python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          packet=(root/"ai-model-only/AI-A-B-QUESTIONS-NO-KEY.json").read_bytes()
          public=json.loads(packet)
          key=json.loads((root/"ai-evidence-key/PROVISIONAL-AI-ANSWER-KEY-NOT-GROUND-TRUTH.json").read_text())
          check=json.loads((root/"ai-model-only/ACTUAL-512-TOKEN-FULL-A-B-INPUT-REPORT.json").read_text())
          replay=json.loads((root/"source-evidence/REPLAY-VERIFIED.json").read_text())
          assert replay["cases_replayed"]==4 and replay["file_replays_verified"]==8
          assert public["status"]=="AI_ASSISTED_DRAFT_COMPARISONS_NOT_INDEPENDENTLY_VALIDATED"
          assert len(public["cases"])==8
          assert key["status"]=="AI_PROPOSED_ANSWER_KEY_NOT_APPROVED"
          assert key["human_reviews"]==0 and not key["network_eligible"]
          assert key["public_packet_sha256"]==hashlib.sha256(packet).hexdigest()
          assert public["human_reviews"]==0 and not public["model_training_authorized"]
          assert public["network_eligible"] is False and public["sealed_holdout"] is False
          assert check["all_pass"] and check["checked_pairs"]==8 and check["model_inputs_checked"]==16
          assert check["maximum_full_model_tokens"]<=512
          assert not check["model_accuracy_measured"] and not check["network_eligible"]
          for offset in range(0,8,2):
              first,second=public["cases"][offset:offset+2]
              assert {first["candidate_a"],first["candidate_b"]}=={second["candidate_a"],second["candidate_b"]}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### AI-assisted security review counterfactual research\n\n")
              f.write("Four real public source+fix+test projects and 8 exact code/test file replays.\\n\\n")
              f.write(f"8 provisional AI-authored A/B examples, full inputs checked: {check['model_inputs_checked']}/16, maximum {check['maximum_full_model_tokens']}/512 ModernBERT tokens.\\n\\n")
              f.write("**0 independent human reviews; 0 accepted pairwise ground-truth labels; no eligible training or network claims.**\\n")
          PY
      - name: Upload candidate questions WITHOUT expected answers or advisory identifiers
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-AI-DRAFT-CONTRASTIVE-QUESTIONS-NOT-ELIGIBLE
          path: ${{ runner.temp }}/ai-model-only/
          if-no-files-found: error
          retention-days: 30
      - name: Upload separate AI-provisional answer key and public patch provenance
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-AI-PROVISIONAL-SOURCE-EVIDENCE-NOT-HUMAN-REVIEWED
          path: |
            ${{ runner.temp }}/ai-evidence-key/
            ${{ runner.temp }}/source-evidence/
          if-no-files-found: error
          retention-days: 30
