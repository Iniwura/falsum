name: Phase 3I - historical Requests proxy-auth redirect boundary in real installed releases
on:
  push:
    paths:
      - 'src/falsum/phase3i_requests_runtime.py'
      - 'tests/test_phase3i_requests_runtime.py'
      - 'docs/PHASE3I.md'
      - 'data/real-fix-queue.json'
      - '.github/workflows/phase3i-requests-runtime.yml'
  pull_request:
    paths:
      - 'src/falsum/phase3i_requests_runtime.py'
      - 'tests/test_phase3i_requests_runtime.py'
      - 'docs/PHASE3I.md'
      - 'data/real-fix-queue.json'
      - '.github/workflows/phase3i-requests-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-request-library:
    name: Real Requests ${{ matrix.requests_version }} offline proxy header behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requests_version: ['2.30.0', '2.31.0']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline adversarial tests and source identity checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/falsum/phase3i_requests_runtime.py tests/test_phase3i_requests_runtime.py
          PYTHONPATH=src:tests python -m unittest discover -s tests -p test_phase3i_requests_runtime.py -v
      - name: Install pinned historical Requests (only predeclared versions)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'requests==${{ matrix.requests_version }}'
          mkdir -p "$RUNNER_TEMP/falsum-phase3i"
          python -m pip freeze > "$RUNNER_TEMP/falsum-phase3i/EXACT-RESOLVED-PYTHON-DEPENDENCIES.txt"
          python - <<'PY'
          import requests, importlib.metadata
          assert requests.__version__ == "${{ matrix.requests_version }}"
          assert importlib.metadata.version("requests") == "${{ matrix.requests_version }}"
          print("Verified real historical installed Requests version",requests.__version__)
          PY
      - name: Execute actual Session.rebuild_proxies on five synthetic in-memory PreparedRequests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.phase3i_requests_runtime run \
            --version '${{ matrix.requests_version }}' \
            --queue data/real-fix-queue.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/falsum-phase3i/REQUESTS-${{ matrix.requests_version }}-REAL-OFFLINE.json"
      - name: Publish controlled versions and synthetic observation booleans, not credentials
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PHASE3I-REQUESTS-${{ matrix.requests_version }}
          path: ${{ runner.temp }}/falsum-phase3i/
          retention-days: 14
          if-no-files-found: error
  contrast:
    name: Verify only the historical HTTPS proxy-auth boundary changes across releases
    runs-on: ubuntu-latest
    needs: actual-request-library
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: FALSUM-PHASE3I-REQUESTS-*
          path: ${{ runner.temp }}/falsum-phase3i
          merge-multiple: false
      - name: Fail closed on missing reversal, changed controls, or false network/model claims
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/falsum-phase3i-final"
          PYTHONPATH=src python -m falsum.phase3i_requests_runtime compare \
            --before "$RUNNER_TEMP/falsum-phase3i/FALSUM-PHASE3I-REQUESTS-2.30.0/REQUESTS-2.30.0-REAL-OFFLINE.json" \
            --after "$RUNNER_TEMP/falsum-phase3i/FALSUM-PHASE3I-REQUESTS-2.31.0/REQUESTS-2.31.0-REAL-OFFLINE.json" \
            --out "$RUNNER_TEMP/falsum-phase3i-final/REAL-REQUESTS-AUTH-HEADER-DELTA-NOT-MODEL-SCORE.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["RUNNER_TEMP"])/"falsum-phase3i-final/REAL-REQUESTS-AUTH-HEADER-DELTA-NOT-MODEL-SCORE.json"
          d=json.loads(f.read_text())
          assert d["historical_https_proxy_header_before"] is True
          assert d["https_proxy_header_after_fix"] is False
          assert d["stable_http_credentialed_proxy_header"] is True
          assert d["stable_other_negative_controls"]==3
          assert d["outbound_network_calls"]==0
          assert d["model_scored"] is False
          assert d["independently_approved_labels"]==0
          assert d["accepted_anjoman_rows"]==0
          assert d["network_eligible"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### Phase 3I: real installed historical Requests redirect-proxy authorization boundary\n\n")
              out.write("Actual Requests **2.30.0** versus **2.31.0**. In-memory Session.rebuild_proxies; no HTTP redirect performed and no network packets sent.\n\n")
              out.write("| Synthetic input | 2.30.0 header | 2.31.0 header |\n| --- | --- | --- |\n")
              out.write("| HTTPS with fake credentialed proxy | **present** | **absent** |\n")
              out.write("| HTTP with fake credentialed proxy | present | present |\n")
              out.write("| HTTPS without proxy credentials | absent | absent |\n")
              out.write("| HTTPS without proxy | absent | absent |\n")
              out.write("| HTTPS without proxy, stale header initially present | absent | absent |\n\n")
              out.write("Real framework method observations, **not actual redirect leakage**, expert ground truth, model scoring, network eligibility or evaluator registration.\n")
          PY
      - name: Publish exactly two-release comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PHASE3I-REQUESTS-REAL-BEHAVIOR-CONTRAST-RESEARCH-ONLY
          path: ${{ runner.temp }}/falsum-phase3i-final/
          retention-days: 14
          if-no-files-found: error
