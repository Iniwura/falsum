name: RESEARCH ONLY - Telegraph V2 ONNX to WASI/WASM prototype

on:
  push:
    paths:
      - '.github/workflows/research-wasm-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wasm-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      SOURCE_RUN: '41126779406'
      KIT_SHA: '5fa5d68bbcf76aaa2093c5d0578f53462bc0e36e'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact quarantined context-training checkpoint (same repository)
        uses: actions/download-artifact@v4
        with:
          name: QUARANTINED-FALSUM-CONTEXT-EXPERIMENT-NOT-SUBMITTABLE
          run-id: 41126779406
          repository: Iniwura/falsum
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/falsum-research-checkpoint
      - name: Refuse missing checkpoints, mismatched model hashes and eligibility claims
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/falsum-wasm-research"
          PYTHONPATH=src python - <<'PY'
          import json, os
          from pathlib import Path
          from falsum.model_eval import adapter_artifact_manifest
          root = Path(os.environ["RUNNER_TEMP"]) / "falsum-research-checkpoint"
          names = ["PILOT-DECISION.json", "CONTEXT-QUARANTINE-MANIFEST.json", "COUNTERFACTUAL-MODEL-RESULT.json"]
          objects = {}
          for name in names:
              paths = list(root.rglob(name))
              assert len(paths) == 1, f"missing or duplicate {name}: {len(paths)}"
              objects[name] = json.loads(paths[0].read_text(encoding="utf-8"))
          configs = list(root.rglob("adapter_config.json"))
          assert len(configs) == 1, f"expected one LoRA checkpoint, got {len(configs)}"
          adapter = configs[0].parent
          assert (adapter/"adapter_model.safetensors").is_file(), "missing trained adapter weights"
          assert not root.is_symlink() and not adapter.is_symlink()
          decision = objects["PILOT-DECISION.json"]
          pilot = objects["CONTEXT-QUARANTINE-MANIFEST.json"]
          scores = objects["COUNTERFACTUAL-MODEL-RESULT.json"]
          assert decision["status"] == "BLOCKED_RESEARCH_ONLY"
          assert decision["registration_authorized"] is False
          assert decision["network_eligible"] is False
          assert pilot["research_only"] is True and pilot["network_eligible"] is False
          assert pilot["training_authorized_for_submission"] is False and pilot["human_reviews"] == 0
          assert pilot["intent"] == decision["intent"] == scores["intent"] == "SECURITY_REVIEW_GENERAL"
          assert scores["model_training_provenance_verified"] is False
          assert decision["research_counterfactual"]["validation_pairwise_accuracy"] == .25
          manifest = adapter_artifact_manifest(adapter)
          assert manifest["sha256"] == decision["adapter_sha256"] == scores["adapter_artifact"]["sha256"], "checkpoint hash does not match scored research model"
          record = {
              "source_run": 41126779406,
              "source_model_sha256": manifest["sha256"],
              "source_status": decision["status"],
              "source_contextual_pr_validation": decision["research_counterfactual"]["validation_pairwise_accuracy"],
              "source_human_reviews": 0, "network_eligible": False,
              "registration_authorized": False,
              "official_kit_sha": os.environ["KIT_SHA"],
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "falsum-wasm-research"
          (output/"RESEARCH-ONLY-SOURCE-PROVENANCE.json").write_text(json.dumps(record,indent=2)+"\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RESEARCH_ADAPTER={adapter}\n")
              env.write(f"RESEARCH_OUT={output}\n")
          print("Verified exact LoRA artifact hash from FAILED-GENERALIZATION research checkpoint", record)
          PY
      - name: Checkout immutable official Telegraph ABI v2 exporter and packager
        uses: actions/checkout@v4
        with:
          repository: telegraphprotocol/telegraph-wasm-baseline
          ref: 5fa5d68bbcf76aaa2093c5d0578f53462bc0e36e
          path: telegraph-kit
          persist-credentials: false
      - name: Install official ONNX export dependencies on CPU
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' 'peft>=0.14,<1' 'onnx>=1.17,<2' 'numpy>=1.26,<3'
          python -m pip freeze > "$RESEARCH_OUT/EXPORT-DEPENDENCIES.txt"
          df -h . | tee "$RESEARCH_OUT/DISK-BEFORE.txt"
      - name: Real ONNX FP32 export from actual quarantined checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=telegraph-kit python -m wide_runtime.export_onnx \
            --base answerdotai/ModernBERT-base \
            --adapter "$RESEARCH_ADAPTER" \
            --out "$RESEARCH_OUT/model.onnx" \
            2>&1 | tee "$RESEARCH_OUT/EXPORT-LOG.txt"
          test -s "$RESEARCH_OUT/model.onnx"
          sha256sum "$RESEARCH_OUT/model.onnx" | tee "$RESEARCH_OUT/ONNX-SHA256.txt"
      - name: Prepare official Go and Rust builders
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: Bake actual ONNX model into WASI command
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          bash telegraph-kit/wide_runtime/vm_float_wasm/bake_wasm.sh \
            "$RESEARCH_OUT/model.onnx" \
            "$RESEARCH_OUT/model.baked.wasm" \
            2>&1 | tee "$RESEARCH_OUT/WASM-BAKE-LOG.txt"
          test -s "$RESEARCH_OUT/model.baked.wasm"
      - name: Package using actual Telegraph ABI v2 and validate structural manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESEARCH_OUT/package"
          cd telegraph-kit
          go run ./cmd/adapterbuild \
            --intent SECURITY_REVIEW_GENERAL \
            --baked-wasm "$RESEARCH_OUT/model.baked.wasm" \
            --out "$RESEARCH_OUT/package" \
            2>&1 | tee "$RESEARCH_OUT/PACKAGE-LOG.txt"
          test -s "$RESEARCH_OUT/package/SECURITY_REVIEW_GENERAL.wasm"
          test -s "$RESEARCH_OUT/package/SECURITY_REVIEW_GENERAL.wasm.manifest.json"
          sha256sum "$RESEARCH_OUT/package/SECURITY_REVIEW_GENERAL.wasm" | tee "$RESEARCH_OUT/PACKAGE-SHA256.txt"
          echo "### QUARANTINED FALSUM WASI model build" >> "$GITHUB_STEP_SUMMARY"
          echo "ABI-v2 structural package was created from real but unreviewed checkpoint." >> "$GITHUB_STEP_SUMMARY"
          echo "**Training and model accuracy remain FAILED/UNREVIEWED. No eligibility, acceptance or registration.**" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive technical logs and quarantined WASM candidate (NEVER REGISTER)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QUARANTINED-FALSUM-WASM-FEASIBILITY-NOT-SUBMITTABLE
          path: |
            ${{ runner.temp }}/falsum-wasm-research/RESEARCH-ONLY-SOURCE-PROVENANCE.json
            ${{ runner.temp }}/falsum-wasm-research/EXPORT-DEPENDENCIES.txt
            ${{ runner.temp }}/falsum-wasm-research/DISK-BEFORE.txt
            ${{ runner.temp }}/falsum-wasm-research/EXPORT-LOG.txt
            ${{ runner.temp }}/falsum-wasm-research/ONNX-SHA256.txt
            ${{ runner.temp }}/falsum-wasm-research/WASM-BAKE-LOG.txt
            ${{ runner.temp }}/falsum-wasm-research/PACKAGE-LOG.txt
            ${{ runner.temp }}/falsum-wasm-research/PACKAGE-SHA256.txt
            ${{ runner.temp }}/falsum-wasm-research/model.onnx.export.json
            ${{ runner.temp }}/falsum-wasm-research/package/SECURITY_REVIEW_GENERAL.wasm.manifest.json
            ${{ runner.temp }}/falsum-wasm-research/package/SECURITY_REVIEW_GENERAL.wasm
          retention-days: 3
          if-no-files-found: warn
