name: Phase 3W - independent GitHub AppSec review intake
on:
  push:
    paths:
      - '.github/ISSUE_TEMPLATE/independent-seven-review.yml'
      - 'src/falsum/phase3w_review_intake.py'
      - 'tests/test_phase3w_review_intake.py'
      - 'docs/REVIEW_ONE_CASE.md'
      - 'docs/PHASE3W.md'
      - '.github/workflows/phase3w-one-click-review.yml'
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/independent-seven-review.yml'
      - 'src/falsum/phase3w_review_intake.py'
      - 'tests/test_phase3w_review_intake.py'
      - 'docs/REVIEW_ONE_CASE.md'
      - 'docs/PHASE3W.md'
      - '.github/workflows/phase3w-one-click-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  source-and-claim-tests:
    name: Evidence/attribution integrity on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate public source-first review form and fail-closed claim parser
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/falsum/phase3w_review_intake.py
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase3w_review_intake.py' -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_phase3g_public_review.py' -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p 'test_independent_review_intake.py' -v
  current-public-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Read live GitHub issue submissions without promoting to security labels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit actual external GitHub issue form claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m falsum.phase3w_review_intake --out "$RUNNER_TEMP/phase3w-live-external-review-claims.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'phase3w-live-external-review-claims.json').read_text())
          assert d['github_issues_fetched_live'] is True
          assert d['review_sources']==7
          assert d['independent_expert_certified_labels']==0
          assert d['accepted_training_pairs']==0
          assert d['trainable_preference_pairs']==[]
          assert d['new_eligible_anjoman_rows']==0
          assert d['registered_evaluator'] is False
          assert d['network_eligible'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### FALSUM Phase 3W: live GitHub external review claim audit\n\n')
              f.write(f"Format-valid distinct public review claims: **{d['public_format_valid_claims']}**. Format-rejected claims: **{d['public_rejected_form_claims']}**.\n\n")
              f.write('**Accepted expert labels: 0. Training pairs: 0. Network eligible rows: 0.** GitHub authorship and source-link formatting do not validate expert independence or security conclusions.\n')
          PY
      - name: Preserve actual attribution report (no raw issue body or secrets)
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PHASE3W-LIVE-GITHUB-CLAIMS-NOT-EXPERT-LABELS
          path: ${{ runner.temp }}/phase3w-live-external-review-claims.json
          retention-days: 30
          if-no-files-found: error
