name: Phase 4O - source-verified security-evaluation material shortcut audit
on:
  pull_request:
    paths:
      - 'src/falsum/phase4o_multibaseline_shortcut_audit.py'
      - 'tests/test_phase4o_multibaseline_shortcut_audit.py'
      - 'docs/PHASE4O_SHORTCUT_ROSTER_AND_REVIEW_GATE.md'
      - '.github/workflows/phase4o-material-shortcut-audit.yml'
      - 'README.md'
  push:
    paths:
      - 'src/falsum/phase4o_multibaseline_shortcut_audit.py'
      - 'tests/test_phase4o_multibaseline_shortcut_audit.py'
      - 'docs/PHASE4O_SHORTCUT_ROSTER_AND_REVIEW_GATE.md'
      - '.github/workflows/phase4o-material-shortcut-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-multibaseline-audit:
    name: Reverify 7 original upstream fixes and inspect 14 adversarial shortcuts
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: src:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline adversarial 4O and 4G casebook tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase4o_multibaseline_shortcut_audit.py' -v
          python -m unittest discover -s tests -p 'test_phase4g_reasoning_puzzles.py' -v
      - name: Revalidate exact public source and regression-test commit blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase4o-evidence
          python -m falsum.phase3f_multifamily_material \
            --old-queue data/real-fix-queue.json \
            --train-queue data/real-fix-train-candidates.json \
            --catalog data/phase2w-applicability-rules.json \
            --out phase4o-evidence/real-source-proof.json
      - name: Rebuild original unadjudicated 14 source-specific questions
        shell: bash
        run: |
          set -euo pipefail
          python -m falsum.phase4g_reasoning_puzzles \
            --source phase4o-evidence/real-source-proof.json \
            --out phase4o-evidence/source-casebook.json \
            --diagnostic phase4o-evidence/old-single-shortcut.json
      - name: Compare fourteen predeclared lexical-only baselines
        shell: bash
        run: |
          set -euo pipefail
          python -m falsum.phase4o_multibaseline_shortcut_audit \
            --source phase4o-evidence/real-source-proof.json \
            --casebook phase4o-evidence/source-casebook.json \
            --out phase4o-evidence/multi-shortcut-hypotheses-not-gold.json
      - name: Publish true negative controls and block overstated evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("phase4o-evidence/multi-shortcut-hypotheses-not-gold.json")
          d=json.loads(p.read_text())
          assert d["shortcuts"]==14
          assert d["exact_AB_presentations"]==28
          assert d["source_cases"]==7
          assert d["author_written_reasoning_conditions"]==14
          assert d["independent_appsec_gold_labels"]==0
          assert d["new_anjoman_rows"]==0
          assert d["foundation_model_called"] is False
          assert d["model_improvement_or_network_ranking_proven"] is False
          assert d["researcher_hypotheses_not_gold"] is True
          assert d["trained_evaluator"] is False
          assert d["no_new_project_holdout"] is True
          assert d["registered_evaluator"] is False
          idx={x["baseline"]:x for x in d["baselines"]}
          assert idx["constant_A"]["author_hypothesis_agreements_across_28_swapped_displays"]==14
          assert idx["constant_B"]["author_hypothesis_agreements_across_28_swapped_displays"]==14
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Phase 4O | source-constrained lexical shortcut adversaries\n\n")
              out.write("All 8 pinned upstream fix and regression-test source checks and 14 source-specific research cases have been revalidated.\n\n")
              out.write("**Researcher hypotheses are NOT independent AppSec gold.** 14 predetermined cheap rules, 14 source conditions and 28 A/B displays.\n\n")
              out.write("| Shortcut baseline | Original 14 | Swapped 28 | Position-invariant /14 | High-risk? |\n|---|---:|---:|---:|---|\n")
              for r in d["baselines"]:
                  out.write(f"| {r['baseline']} | {r['author_hypothesis_agreements_across_14_original_displays']}/14 | {r['author_hypothesis_agreements_across_28_swapped_displays']}/28 | {r['same_answer_chosen_after_AB_swap_out_of_14']} | {r['flag_high_shortcut_risk']} |\n")
              out.write("\nStrong shortcut flags: **"+", ".join(d["flagged_baselines"] or ["none within this limited roster"])+"**. No hidden-gold, network accuracy, expert validation or trained-model improvement.\n")
          if d["flags_high_shortcut_risk"]:
              # The report is still uploaded below for diagnosis. A high shortcut
              # win is not a passing material-quality gate.
              raise SystemExit("FAIL: predeclared simple shortcut agrees with >=11/14 author hypotheses; revise content and independently review before release")
          PY
      - name: Preserve all source, casebook, baseline and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4o-source-locked-shortcut-material-research-not-expert-gold
          path: phase4o-evidence/*.json
          if-no-files-found: warn
          retention-days: 90
