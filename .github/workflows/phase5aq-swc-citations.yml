name: Phase 5AQ - original registry exact citation coverage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/falsum/phase5aq_swc_citations.py'
      - 'tests/test_phase5aq_swc_citations.py'
      - '.github/workflows/phase5aq-swc-citations.yml'
  push:
    branches: [main]
    paths:
      - 'src/falsum/phase5aq_swc_citations.py'
      - 'tests/test_phase5aq_swc_citations.py'
      - '.github/workflows/phase5aq-swc-citations.yml'
permissions:
  contents: read
jobs:
  citations:
    name: Pinned SWC registry citation replay / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_phase5aq_swc_citations.py' -v
      - run: PYTHONPATH=src python -m falsum.phase5aq_swc_citations --out phase5aq-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5aq-registry-citation-coverage-${{ matrix.python }}
          path: phase5aq-report.json
          if-no-files-found: error
