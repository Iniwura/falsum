name: Phase 3E - independent-source security review material, no invented labels
on:
  push:
    paths:
      - 'src/falsum/phase3e_review_packets.py'
      - 'tests/test_phase3e_review_packets.py'
      - 'src/falsum/phase3e_review_intake.py'
      - 'tests/test_phase3e_review_intake.py'
      - '.github/workflows/phase3e-independent-review.yml'
      - 'data/phase3a-external-source-cases.json'
      - 'data/phase3a-dependency-manifests.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-review-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarially validate external provenance, no deployment inference, and human label separation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:tests python -m unittest discover -s tests -p test_phase3e_review_packets.py -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p test_phase3e_review_intake.py -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p test_phase3a_external_sources.py -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p test_phase3a_dependency_manifests.py -v
          PYTHONPATH=src:tests python -m unittest discover -s tests -p test_phase3d_research_evidence.py -v
      - name: Fetch and Git-blob verify genuine code plus dependencies at original upstream commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/falsum-phase3e"
          PYTHONPATH=src python -m falsum.phase3e_review_packets \
            --sources-contract data/phase3a-external-source-cases.json \
            --dependency-contract data/phase3a-dependency-manifests.json \
            --out "$RUNNER_TEMP/falsum-phase3e/INDEPENDENT-REVIEW-QUEUE-NOT-EXPERT-LABELS.json"
      - name: Generate blank SHA-bound reviewer submission and verify zero accepted human labels
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          from falsum.phase2w_proof_gate import _canonical
          d=Path(os.environ["RUNNER_TEMP"])/"falsum-phase3e"
          p=json.loads((d/"INDEPENDENT-REVIEW-QUEUE-NOT-EXPERT-LABELS.json").read_text())
          r={
              "schema_version":1,
              "status":"UNVERIFIED_PUBLIC_REVIEW_SUBMISSIONS",
              "packet_bundle_sha256":hashlib.sha256(_canonical(p)).hexdigest(),
              "reviews":[]
          }
          (d/"BLANK-INDEPENDENT-REVIEW-CLAIMS.json").write_text(json.dumps(r,indent=2)+"\n")
          PY
          PYTHONPATH=src python -m falsum.phase3e_review_intake \
            --packets "$RUNNER_TEMP/falsum-phase3e/INDEPENDENT-REVIEW-QUEUE-NOT-EXPERT-LABELS.json" \
            --reviews "$RUNNER_TEMP/falsum-phase3e/BLANK-INDEPENDENT-REVIEW-CLAIMS.json" \
            --out "$RUNNER_TEMP/falsum-phase3e/VERIFIED-NO-EXPERT-LABELS-YET.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"falsum-phase3e"
          out=json.loads((d/"VERIFIED-NO-EXPERT-LABELS-YET.json").read_text())
          assert out["source_review_packets"]==5
          assert out["self_reported_review_records"]==0
          assert out["verified_independent_human_labels"]==0
          assert out["accepted_training_pairs"]==0
          assert out["evaluator_registered"] is False
          assert out["network_eligible"] is False
          PY
      - name: Explicitly reject automatic trainer use and eligibility claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path(os.environ["RUNNER_TEMP"])/"falsum-phase3e/INDEPENDENT-REVIEW-QUEUE-NOT-EXPERT-LABELS.json"
          d=json.loads(file.read_text(encoding="utf-8"))
          assert d["status"]=="PHASE3E_INDEPENDENT_SOURCE_REVIEW_PACKETS_UNADJUDICATED"
          assert d["external_projects"]==3
          assert d["external_source_calls"]==5 and len(d["packets"])==5
          assert d["external_dependency_profiles"]==4
          assert d["actual_third_party_apps_executed"]==0
          assert d["independent_human_labels"]==0
          assert d["accepted_training_pairs"]==0
          assert d["network_eligible"] is False
          for p in d["packets"]:
              assert p["label_status"]=="NOT_INDEPENDENTLY_ADJUDICATED"
              assert p["training_eligible"] is False
              assert p["official_network_eligible"] is False
              assert p["confirmed_exploit"] is False
              assert p["reviewer_preference"] is None
              assert all(v["confirmed_actual_install"] is False for v in p["dependency_declarations"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### FALSUM Phase 3E: third-party-source-backed reviewer queue\n\n")
              f.write("**5 authentic call-site review questions** generated from 3 independent repository revisions and 4 actual dependency declaration profiles with their exact Git blob hashes.\n\n")
              f.write("No execution of third-party code. **0 independently validated labels**, **0 accepted Anjoman pairs**, **0 registered evaluators**. The 5 pairs are candidate material only and MUST NOT be uploaded to Telegraph as eligible scores without independent validation.\n\n")
              f.write("This provides reproducible review workflow and provenance; it does not solve our Phase3D model's 0/2 reversal failure or certify security judgment quality.\n")
          PY
      - name: Archive only public-source provenance and unadjudicated question packets
        uses: actions/upload-artifact@v4
        with:
          name: FALSUM-PHASE3E-EXTERNAL-REVIEW-QUEUE-NOT-ELIGIBLE-NO-HUMAN-LABELS
          path: ${{ runner.temp }}/falsum-phase3e/INDEPENDENT-REVIEW-QUEUE-NOT-EXPERT-LABELS.json
          retention-days: 14
          if-no-files-found: error
